<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GOAL TIME">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F7D45"/>
      <stop offset="1" stop-color="#05512C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD96B"/>
      <stop offset="1" stop-color="#E09A00"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#pitch)"/>

  <!-- mown stripes -->
  <g fill="#FFFFFF" opacity="0.05">
    <rect x="0" y="64" width="512" height="64"/>
    <rect x="0" y="192" width="512" height="64"/>
    <rect x="0" y="320" width="512" height="64"/>
    <rect x="0" y="448" width="512" height="64"/>
  </g>

  <!-- chalk: halfway line and centre circle -->
  <g stroke="#F2F7F1" stroke-opacity="0.34" fill="none" stroke-width="8">
    <line x1="48" y1="256" x2="464" y2="256"/>
    <circle cx="256" cy="256" r="96"/>
    <rect x="44" y="44" width="424" height="424" rx="76"/>
  </g>

  <!-- star in the centre circle -->
  <path
    fill="url(#gold)"
    stroke="#8A5E00"
    stroke-width="6"
    stroke-linejoin="round"
    d="M256 158l31 63 70 10-51 49 12 69-62-33-62 33 12-69-51-49 70-10z"
  />
</svg>
